spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://rupe-server.mysql.database.azure.com:3306/rupe}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  application:
    name: rupe
  output:
    ansi:
      enabled: always
springdoc:
  swagger-ui:
    tag-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
    syntax-highlight:
      theme: nord
